<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <!-- viewport-fit=cover lets the composer sit under the iOS home indicator
       and pad itself back out with env(safe-area-inset-*). -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="description" content="DeepGrove — frontier intelligence, on any device." />
  <meta name="theme-color" content="#f6f5f0" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <title>DeepGrove</title>

  <script>
    // Where /api/* lives. Empty means same-origin, which is what local dev
    // wants (app.py serves both page and API) and also what the gateway wants
    // when it serves this page itself.
    window.DEEPGROVE_API_BASE = "";

    // Cloudflare Turnstile sitekey (public — the secret stays server-side).
    // Blank on loopback: the widget is scoped to chat.deepgrove.ai, so it
    // would refuse to issue a token against localhost and lock local dev out
    // of its own session endpoint. app.py expects no verification anyway.
    window.DEEPGROVE_LOOPBACK =
      ["localhost", "127.0.0.1", "[::1]"].includes(location.hostname);
    window.DEEPGROVE_TURNSTILE_SITEKEY =
      window.DEEPGROVE_LOOPBACK ? "" : "0x4AAAAAAEAeBPUcOjdClPjp";

    // Decided here rather than in chat.js so the lock screen is painted with
    // the first frame — set it after the page renders and the chat flashes
    // into view first. The real check is server-side at /api/session; if this
    // guess is wrong in either direction the mint response corrects it.
    //
    // The gateway rewrites the token below to "true" / "false" to match
    // GATEWAY_REQUIRE_PASSWORD as it serves this file. Served raw (local dev
    // through app.py, or any plain static host) it stays literal and reads as
    // true — so the default, when nothing tells us otherwise, is "gated".
    window.DEEPGROVE_REQUIRE_CODE = ("false" !== "false");

    if (window.DEEPGROVE_REQUIRE_CODE && !window.DEEPGROVE_LOOPBACK) {
      document.documentElement.setAttribute("data-gate", "");
    }
  </script>

  <!-- Inline, not in style.css, on purpose. These two rules are the whole
       difference between a locked page and an open one, and an external
       stylesheet can be stale, blocked, or slow. The look of the gate can
       live in the cached file; whether it covers the page cannot. -->
  <style>
    #gate { display: none; }
    html[data-gate] #gate { display: flex; }
    html[data-gate] #main { visibility: hidden; }
  </style>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Inter+Tight:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" type="image/svg+xml" href="/static/tree.svg" />
  <!-- markdown + math + code formatting for assistant responses -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css" integrity="sha384-nB0miv6/jRmo5UMMR1wu3Gz6NLsoTkbqJghGIsx//Rlm+ZU03BU6SQNC66uf4l5+" crossorigin="anonymous" />
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js" integrity="sha384-7zkQWkzuo3B5mTepMUcHkMB5jZaolc2xDwL6VFqjFALcbeS9Ggm/Yr2r3Dy4lfFg" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js" integrity="sha384-43gviWU0YVjaDtb/GhzOouOXtZMP/7XUzwPTstBeZFe/+rCMvRwr4yROQP43s0Xk" crossorigin="anonymous"></script>
  <!-- @highlightjs/cdn-assets, not npm highlight.js/lib/* — the latter is a
       CommonJS build that throws "require is not defined" in a browser. -->
  <script defer src="https://cdn.jsdelivr.net/npm/@highlightjs/cdn-assets@11.9.0/highlight.min.js" integrity="sha384-F/bZzf7p3Joyp5psL90p/p89AZJsndkSoGwRpXcZhleCWhd8SnRuoYo4d0yirjJp" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/marked@12.0.2/lib/marked.umd.min.js" integrity="sha384-g+bkfjJw18BIw5cMo99rClhgmX+PThUSSYYevb6sk76sliU2l+O7/cj5q1Nbl3Cw" crossorigin="anonymous"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" integrity="sha384-+VfUPEb0PdtChMwmBcBmykRMDd+v6D/oFmB3rZM/puCMDYcIvF968OimRh4KQY9a" crossorigin="anonymous"></script>
  <!-- Versioned like chat.js. The gate's layout lives in here, so an old
       cached stylesheet would render the lock screen as an ordinary block at
       the foot of a fully usable page. -->
  <link rel="stylesheet" href="/static/style.css?v=stream40" />
</head>
<body>
  <!-- Starts centred. The class is in the markup rather than set by chat.js so
       the first paint is already correct — adding it afterwards would show the
       composer at the bottom for a frame and then jump it to the middle. -->
  <main id="main" class="empty">
    <header id="topbar">
      <!-- Absolute, same tab — for the same reasons as the research link
           below: this page is served from two origins, so a root-relative
           path would resolve against chat.deepgrove.ai. -->
      <div class="topbar-left">
        <a class="brand" href="https://deepgrove.ai/">
          <span class="brand-text">DeepGrove</span>
        </a>
        <button class="new-chat-btn" id="newChatBtn" title="new chat">
          <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
            <line x1="12" y1="5" x2="12" y2="19" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            <line x1="5" y1="12" x2="19" y2="12" stroke="currentColor" stroke-width="2" stroke-linecap="round" />
          </svg>
          <span>new chat</span>
        </button>

        <!-- These decide what the request looks like, so they are fixed once a
             conversation has one. See setSettingsLocked in chat.js. -->
        <div class="settings-wrap">
          <button class="new-chat-btn" id="settingsBtn" title="settings"
                  aria-expanded="false" aria-controls="settingsPanel">
            <svg viewBox="0 0 24 24" width="14" height="14" aria-hidden="true">
              <circle cx="12" cy="12" r="3.2" fill="none" stroke="currentColor" stroke-width="2" />
              <path d="M12 2.6v2.6M12 18.8v2.6M21.4 12h-2.6M5.2 12H2.6M18.6 5.4l-1.8 1.8M7.2 16.8l-1.8 1.8M18.6 18.6l-1.8-1.8M7.2 7.2 5.4 5.4"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" />
            </svg>
            <span>settings</span>
          </button>

          <div class="settings-panel hidden" id="settingsPanel" role="dialog" aria-label="settings">
            <label class="setting" for="tempRange">
              <span class="setting-head">
                <span class="setting-name">temperature</span>
                <span class="setting-val" id="tempVal">1.0</span>
              </span>
              <input type="range" id="tempRange" min="0" max="2" step="0.1" value="1.0" />
              <span class="setting-note">lower is steadier, higher is more varied</span>
            </label>

            <label class="setting row" for="searchOpt">
              <span class="setting-text">
                <span class="setting-name">web search</span>
                <span class="setting-note">looks things up before answering</span>
              </span>
              <input type="checkbox" id="searchOpt" class="switch" checked />
            </label>

            <label class="setting row" for="pythonOpt">
              <span class="setting-text">
                <span class="setting-name">python</span>
                <span class="setting-note">runs code in your browser</span>
              </span>
              <input type="checkbox" id="pythonOpt" class="switch" checked />
            </label>

            <p class="settings-locked hidden" id="settingsLocked">
              fixed for this chat — start a new chat to change them
            </p>
          </div>
        </div>
      </div>
      <div class="topbar-right">
        <!-- Same tab: this is a link back into the same product, not out of
             it. Absolute rather than /research because this page is served
             from two origins — a root-relative path would resolve against
             chat.deepgrove.ai, where nothing answers it. -->
        <a class="topbar-link" href="https://deepgrove.ai/research">research</a>
      </div>
    </header>

    <section id="chatArea">
      <!-- messages get appended here -->
      <div id="messages"></div>
    </section>

    <footer id="composer">
      <form id="composerForm">
        <div class="composer-shell">
          <textarea
            id="composerInput"
            placeholder="message DeepGrove…"
            rows="1"
            autofocus
          ></textarea>
          <button type="submit" id="sendBtn" aria-label="send" title="send">
            <svg class="icon-send" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <path d="M5 12 L 19 12 M 13 6 L 19 12 L 13 18"
                    fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <svg class="icon-stop" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true">
              <rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor" />
            </svg>
          </button>
        </div>
      </form>
    </footer>
  </main>

  <!-- lock screen — shown while <html data-gate> is set -->
  <div id="gate">
    <form id="gateForm" class="gate-card">
      <h2>DeepGrove</h2>
      <p class="gate-sub">enter the access code to continue</p>
      <input
        id="gateInput"
        type="password"
        autocomplete="current-password"
        placeholder="access code"
        aria-label="access code"
        spellcheck="false"
      />
      <button type="submit" id="gateBtn">enter</button>
      <p id="gateError" class="gate-error" role="alert"></p>
    </form>
  </div>

  <!-- Deliberately a child of <body>, outside both #main and #gate. Turnstile
       will not run inside a hidden container, and the first thing it is needed
       for is unlocking the gate — while #main is still visibility:hidden. Sat
       in the composer, it hung there forever and the access code was never
       even sent. Normally :empty, so it collapses and shows nothing. -->
  <div id="turnstileHost"></div>

  <script src="/static/chat.js?v=stream40"></script>
</body>
</html>
